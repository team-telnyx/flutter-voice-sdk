# Step 4 of the release flow: publishes packages/telnyx_webrtc to pub.dev from a vX.Y.Z tag.
#
# release-03-create-gh-release starts this automatically on the new tag. To run it by
# hand (for example to retry a failed publish), choose the vX.Y.Z tag, not main, in
# "Use workflow from"; runs on a branch are skipped.
name: release-04-publish-pub-dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Started by release-03 on the release tag. Requires "Enable publishing from
  # workflow_dispatch events" in the pub.dev package admin settings.
  workflow_dispatch:

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      id-token: write # Required for authentication using OIDC
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/telnyx_webrtc
