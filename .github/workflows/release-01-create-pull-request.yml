# Creates a Flutter SDK release pull request.
#
# The PR updates:
# - packages/telnyx_webrtc/pubspec.yaml
# - packages/telnyx_webrtc/lib/utils/version_utils.dart
# - packages/telnyx_webrtc/CHANGELOG.md
#
# Requires RELEASE_AUTOMATION_TOKEN to be a PAT or GitHub App token with contents
# and pull-request write access. Using GITHUB_TOKEN here would create a release PR
# whose CI workflows do not run.
#
# Note: Flutter intentionally skips release-02 because this repo does not have the
# iOS docs-generation release step.
name: release-01-create-pull-request

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to release, for example 4.5.0'
        required: true
        type: string
      release_notes:
        description: 'Optional extra notes to prepend above the generated merged-PR list'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  create_release_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release automation token
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN must be configured so release PR pushes trigger CI." >&2
            exit 1
          fi

      - name: Normalize version
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 scripts/release/update_flutter_release.py normalize \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Get previous release tag
        id: previous_tag
        run: |
          git tag --list > tags.txt
          PREVIOUS_TAG=$(python3 scripts/release/update_flutter_release.py previous-tag \
            --version "${{ steps.release.outputs.version }}" \
            --tags-file tags.txt)
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

      - name: Generate changelog from merged PRs
        id: pr_list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.previous_tag }}
          EXTRA_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log --reverse --pretty=format:"%H" "$PREVIOUS_TAG"..HEAD > commits.txt
          else
            git log --reverse --pretty=format:"%H" HEAD > commits.txt
          fi

          : > pr_data.tsv
          : > seen_prs.txt
          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${commit}/pulls" \
              --jq '.[] | [.number, .title, ([.labels[].name] | join(","))] | @tsv' >> pr_candidates.tsv
          done < commits.txt

          if [[ -f pr_candidates.tsv ]]; then
            while IFS=$'\t' read -r number title labels; do
              [[ -n "$number" ]] || continue
              if ! grep -qx "$number" seen_prs.txt; then
                echo "$number" >> seen_prs.txt
                printf '%s\t%s\t%s\n' "$number" "$title" "$labels" >> pr_data.tsv
              fi
            done < pr_candidates.tsv
          fi

          python3 scripts/release/update_flutter_release.py format-changelog \
            --pr-data pr_data.tsv \
            --previous-tag "$PREVIOUS_TAG" \
            --output generated_changelog.md

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "changelog<<$delimiter"
            cat generated_changelog.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Update package version and changelog
        run: |
          python3 scripts/release/update_flutter_release.py update \
            --version "${{ steps.release.outputs.version }}" \
            --changelog generated_changelog.md

      - name: Cleanup generated helper files
        run: rm -f tags.txt commits.txt seen_prs.txt pr_candidates.tsv pr_data.tsv generated_changelog.md

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          commit-message: "chore: release telnyx_webrtc v${{ steps.release.outputs.version }}"
          title: "Release telnyx_webrtc v${{ steps.release.outputs.version }}"
          body: |
            Auto-created release PR for `telnyx_webrtc` **v${{ steps.release.outputs.version }}**.

            Target release tag: `${{ steps.release.outputs.tag }}`
            Previous release tag: `${{ steps.previous_tag.outputs.previous_tag }}`

            ## Changelog preview
            ${{ steps.pr_list.outputs.changelog }}

            ## Release checklist
            - [ ] Confirm version bump in `packages/telnyx_webrtc/pubspec.yaml`
            - [ ] Confirm SDK user-agent version in `packages/telnyx_webrtc/lib/utils/version_utils.dart`
            - [ ] Confirm `packages/telnyx_webrtc/CHANGELOG.md`
            - [ ] After merge, run `release-03-create-gh-release` with version `${{ steps.release.outputs.version }}`
          branch: release/${{ steps.release.outputs.version }}
          base: main
          delete-branch: true
