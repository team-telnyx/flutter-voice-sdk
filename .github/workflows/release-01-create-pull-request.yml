# Creates a Flutter SDK release pull request.
#
# The PR updates:
# - packages/telnyx_webrtc/pubspec.yaml
# - packages/telnyx_webrtc/lib/utils/version_utils.dart
# - packages/telnyx_webrtc/CHANGELOG.md
name: release-01-create-pull-request

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to release, for example 4.5.0'
        required: true
        type: string
      release_notes:
        description: 'Optional extra notes to prepend above the generated merged-PR list'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version and find previous tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver-like, for example 4.5.0 or 4.5.0-beta.1" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$' | head -n 1 || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
          echo "Release tag: $TAG"
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"

      - name: Generate release notes from merged PRs
        id: pr_list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          EXTRA_NOTES: ${{ github.event.inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log --pretty=format:"%H" "$PREVIOUS_TAG"..HEAD > commits.txt
          else
            git log --pretty=format:"%H" HEAD > commits.txt
          fi

          gh pr list --state merged --base main --limit 200 --json title,number,mergeCommit \
            --jq '.[] | [.title, .number, (.mergeCommit.oid // "")] | @tsv' > pr_data.tsv

          : > generated_changelog.md
          if [[ -n "$EXTRA_NOTES" ]]; then
            printf '%s\n\n' "$EXTRA_NOTES" >> generated_changelog.md
          fi

          echo "### Changes since ${PREVIOUS_TAG:-repository start}" >> generated_changelog.md
          added=false
          while IFS=$'\t' read -r title number commit; do
            if [[ -n "$commit" ]] && grep -q "$commit" commits.txt; then
              echo "- PR #$number: $title" >> generated_changelog.md
              added=true
            fi
          done < pr_data.tsv

          if [[ "$added" == "false" ]]; then
            echo "- No merged pull requests detected in this range." >> generated_changelog.md
          fi

          {
            echo "changelog<<EOF"
            cat generated_changelog.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update package version and changelog
        run: |
          python3 scripts/release/update_flutter_release.py \
            --version "${{ steps.release.outputs.version }}" \
            --changelog generated_changelog.md

      - name: Cleanup generated helper files
        run: rm -f commits.txt pr_data.tsv generated_changelog.md

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: release telnyx_webrtc v${{ steps.release.outputs.version }}"
          title: "Release telnyx_webrtc v${{ steps.release.outputs.version }}"
          body: |
            Auto-created release PR for `telnyx_webrtc` **v${{ steps.release.outputs.version }}**.

            Target release tag: `${{ steps.release.outputs.tag }}`
            Previous release tag: `${{ steps.release.outputs.previous_tag }}`

            ## Changelog preview
            ${{ steps.pr_list.outputs.changelog }}

            ## Release checklist
            - [ ] Confirm version bump in `packages/telnyx_webrtc/pubspec.yaml`
            - [ ] Confirm SDK user-agent version in `packages/telnyx_webrtc/lib/utils/version_utils.dart`
            - [ ] Confirm `packages/telnyx_webrtc/CHANGELOG.md`
            - [ ] After merge, run `release-03-create-gh-release` with version `${{ steps.release.outputs.version }}`
          branch: release/${{ steps.release.outputs.version }}
          base: main
          delete-branch: true
          labels: auto-generated,release
