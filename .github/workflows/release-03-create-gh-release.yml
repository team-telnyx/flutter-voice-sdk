# Creates a GitHub Release for telnyx_webrtc from the release PR already merged to main.
#
# Requires RELEASE_AUTOMATION_TOKEN to be a PAT or GitHub App token with contents
# write access. The resulting tag push triggers publish.yml; GITHUB_TOKEN-created
# tags would not trigger the pub.dev publish workflow.
name: release-03-create-gh-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to release, for example 4.5.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create_github_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require release automation token
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN must be configured so the release tag triggers pub.dev publishing." >&2
            exit 1
          fi

      - name: Normalize version
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 scripts/release/update_flutter_release.py normalize \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate merged release files
        run: |
          python3 scripts/release/update_flutter_release.py validate \
            --version "${{ steps.release.outputs.version }}"
          if git rev-parse "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.release.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Build release notes from CHANGELOG.md
        run: |
          python3 scripts/release/update_flutter_release.py release-notes \
            --version "${{ steps.release.outputs.version }}" \
            --output release_body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          args=("$TAG" --target "$target_sha" --title "telnyx_webrtc $VERSION" --notes-file release_body.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
